# Runs on every push and pull request: builds the frontend, runs every Rust
# test (app, server and protocol), and checks dependencies for known
# vulnerabilities. A red cross on a commit means one of these failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Windows needs no extra system libraries for Tauri, and matches the main
    # platform Axiom ships on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Type-checks and builds dist/, which the app embeds when it compiles.
      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --workspace --locked

  macos:
    name: Build and test (macOS)
    # Mac-only code (the menu bar, the Keychain) only compiles here, so problems
    # show up on push rather than halfway through a release.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # The app embeds dist/ when it compiles.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the app's tests
        run: cargo test -p axiom --locked

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install shared desktop UI dependencies
        run: npm ci
        working-directory: .

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Account API regression checks
        run: node ../tests/site-account-api.mjs

      # Type-checks and prerenders every page, as Vercel does.
      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: npm audit
        run: npm audit --audit-level=high

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Exceptions, with reasons, live in .cargo/audit.toml.
      - name: cargo audit
        run: cargo audit
