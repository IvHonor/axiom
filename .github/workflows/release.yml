# Publishes a release when a version tag is pushed (npm version <x.y.z>, then
# git push --follow-tags). Builds the Windows installers and a universal macOS
# app (Apple Silicon and Intel), signs them for the updater, and attaches them
# plus latest.json to a GitHub Release. Installed copies of Axiom find new
# versions through that latest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish (${{ matrix.name }})
    strategy:
      # One at a time, Windows first: each build adds its platform to the
      # release's latest.json, and two at once could overwrite each other.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            targets: ""
            args: ""
          - name: macOS
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      # Before the 15-minute build, not after: a bad key only fails at the
      # very end. Prints nothing about the key but its length.
      - name: Check the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is empty or missing. Add it under Settings > Secrets and variables > Actions > Secrets (not Variables)."
            exit 1
          fi
          decoded="$(printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)"
          # A secret key decodes to "untrusted comment: … secret key" and a
          # second line, about 260 bytes; the public key or a cut-off paste doesn't.
          case "$decoded" in
            "untrusted comment:"*"secret key"*)
              if [ "${#decoded}" -lt 200 ]; then
                echo "::error::TAURI_SIGNING_PRIVATE_KEY is cut off (${#KEY} characters; the key file is a single line of about 348). Paste the whole line again."
                exit 1
              fi
              echo "Signing key looks right (${#KEY} characters)."
              ;;
            *)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't the signing key (${#KEY} characters; the key file is a single line of about 348). Paste the contents of the .key file, not the .key.pub file."
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates. Only this workflow and the maintainer have the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # The live account server, built into the app.
          AXIOM_SERVER_URL: https://axiom-server-1bil.onrender.com
          # Calendar sign-in (Google, Outlook). Empty switches that provider off.
          AXIOM_GOOGLE_CLIENT_ID: ${{ secrets.AXIOM_GOOGLE_CLIENT_ID }}
          AXIOM_GOOGLE_CLIENT_SECRET: ${{ secrets.AXIOM_GOOGLE_CLIENT_SECRET }}
          AXIOM_MICROSOFT_CLIENT_ID: ${{ secrets.AXIOM_MICROSOFT_CLIENT_ID }}
          # Learning's YouTube playlist import. Empty hides it.
          AXIOM_YOUTUBE_API_KEY: ${{ secrets.AXIOM_YOUTUBE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Axiom ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download the file ending in `_x64-setup.exe` below and run it. "Windows protected your PC"? The installer isn't code-signed yet: choose **More info**, then **Run anyway**.

            **macOS** (Apple Silicon and Intel, macOS 11 or later): download the file ending in `_universal.dmg`, open it and drag Axiom into Applications. The first time you open it, macOS says it can't check the developer: open **System Settings → Privacy & Security**, scroll down and choose **Open Anyway**. If it asks to use your keychain after an update, choose **Always Allow**.

            If you already have Axiom, it offers this update by itself.

            Found a problem, have a question or an idea? Use the **support button** (the lifebuoy at the top right of Axiom), and we'll reply by email.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          # Turns on update signing (see src-tauri/tauri.release.conf.json).
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
