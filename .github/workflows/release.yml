# Publishes a release when a version tag is pushed (npm version <x.y.z>, then
# git push --follow-tags). Builds the Windows installers, signs them for the
# updater, and attaches them plus latest.json to a GitHub Release. Installed
# copies of Axiom find new versions through that latest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates. Only this workflow and the maintainer have the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # The live account server, built into the app.
          AXIOM_SERVER_URL: https://axiom-server-1bil.onrender.com
          # Calendar sign-in (Google, Outlook). Empty switches that provider off.
          AXIOM_GOOGLE_CLIENT_ID: ${{ secrets.AXIOM_GOOGLE_CLIENT_ID }}
          AXIOM_GOOGLE_CLIENT_SECRET: ${{ secrets.AXIOM_GOOGLE_CLIENT_SECRET }}
          AXIOM_MICROSOFT_CLIENT_ID: ${{ secrets.AXIOM_MICROSOFT_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Axiom ${{ github.ref_name }}
          releaseBody: |
            **To install on Windows**, download the file ending in `_x64-setup.exe` below and run it. If you already have Axiom, it offers this update by itself.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          # Turns on update signing (see src-tauri/tauri.release.conf.json).
          args: --config src-tauri/tauri.release.conf.json
