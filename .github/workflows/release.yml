# Publishes a release when a version tag is pushed (npm version <x.y.z>, then
# git push --follow-tags). Builds the Windows installers, signs them for the
# updater, and attaches them plus latest.json to a GitHub Release. Installed
# copies of Axiom find new versions through that latest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      # Before the 15-minute build, not after: a bad key only fails at the
      # very end. Prints nothing about the key but its length.
      - name: Check the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is empty or missing. Add it under Settings > Secrets and variables > Actions > Secrets (not Variables)."
            exit 1
          fi
          decoded="$(printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)"
          # A secret key decodes to "untrusted comment: … secret key" and a
          # second line, about 260 bytes; the public key or a cut-off paste doesn't.
          case "$decoded" in
            "untrusted comment:"*"secret key"*)
              if [ "${#decoded}" -lt 200 ]; then
                echo "::error::TAURI_SIGNING_PRIVATE_KEY is cut off (${#KEY} characters; the key file is a single line of about 348). Paste the whole line again."
                exit 1
              fi
              echo "Signing key looks right (${#KEY} characters)."
              ;;
            *)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't the signing key (${#KEY} characters; the key file is a single line of about 348). Paste the contents of the .key file, not the .key.pub file."
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates. Only this workflow and the maintainer have the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # The live account server, built into the app.
          AXIOM_SERVER_URL: https://axiom-server-1bil.onrender.com
          # Calendar sign-in (Google, Outlook). Empty switches that provider off.
          AXIOM_GOOGLE_CLIENT_ID: ${{ secrets.AXIOM_GOOGLE_CLIENT_ID }}
          AXIOM_GOOGLE_CLIENT_SECRET: ${{ secrets.AXIOM_GOOGLE_CLIENT_SECRET }}
          AXIOM_MICROSOFT_CLIENT_ID: ${{ secrets.AXIOM_MICROSOFT_CLIENT_ID }}
          # Learning's YouTube playlist import. Empty hides it.
          AXIOM_YOUTUBE_API_KEY: ${{ secrets.AXIOM_YOUTUBE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Axiom ${{ github.ref_name }}
          releaseBody: |
            **To install on Windows**, download the file ending in `_x64-setup.exe` below and run it. If you already have Axiom, it offers this update by itself.

            **"Windows protected your PC"?** Axiom's installer isn't code-signed yet, so Windows doesn't recognise it. Choose **More info**, then **Run anyway**. After that, updates install from inside Axiom.

            Found a problem, have a question or an idea? Use the **support button** (the lifebuoy at the top right of Axiom), and we'll reply by email.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          # Turns on update signing (see src-tauri/tauri.release.conf.json).
          args: --config src-tauri/tauri.release.conf.json
