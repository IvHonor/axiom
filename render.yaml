# Render blueprint for the Axiom server: Render -> New -> Blueprint -> pick this repo.
# Free plan: sleeps after 15 minutes idle and takes about a minute to wake.
# Ohio sits next to Neon's us-east-2, so database queries take milliseconds.
services:
  - type: web
    name: axiom-server
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Paste Neon's connection string when Render asks for it.
      - key: DATABASE_URL
        sync: false
      # Render generates a random secret once and keeps it.
      - key: JWT_SECRET
        generateValue: true
      # The visitor's real IP, for rate limiting. Render sits behind Cloudflare,
      # which sets this header (and overwrites any a client sends). The last
      # X-Forwarded-For entry is Cloudflare's own address, a new one each time.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # From resend.com -> API Keys. Without it, reset codes only go to the log.
      - key: RESEND_API_KEY
        sync: false
      # A sender on a domain verified in Resend, e.g. "Axiom <noreply@yourdomain.com>".
      - key: EMAIL_FROM
        sync: false
      # Comma-separated emails of the admins who approve the waiting list.
      - key: ADMIN_EMAILS
        sync: false
      # Where people write about their data, shown in the privacy notice at /privacy.
      - key: CONTACT_EMAIL
        sync: false
      # Who runs this server, named in the privacy notice and terms.
      - key: OPERATOR_NAME
        sync: false
      # Shared with the website (its AXIOM_WEB_PROXY_SECRET), so website sign-ins are
      # rate limited per visitor. At least 32 characters: openssl rand -base64 48
      - key: WEB_PROXY_SECRET
        sync: false
      # The assistant's AI: Groq answers on its free plan, and its Whisper writes
      # down what's said. Key from console.groq.com/keys (turn on Zero Data
      # Retention there). A Gemini key is optional and only used once GEMINI_PAID
      # is "yes" (Google allows only its paid service for apps used in the UK,
      # EEA and Switzerland); then Gemini answers instead. Leave the Gemini ones
      # unset to stay free.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PAID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # An emergency brake on the assistant's AI calls per day across every
      # account. Leave it unset for no limit; watch use in the admin panel.
      - key: AI_DAILY_LIMIT
        sync: false
      # New accounts wait for approval. Set to "off" to let anyone sign up.
      - key: WAITLIST
        value: "on"
