[package]
name = "axiom"
version = "0.1.0"
description = "Axiom desktop app"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "axiom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.54", features = ["sync", "time", "macros", "net", "io-util"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.28", features = ["v4", "v7"] }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
# Stores the sign-in in Windows Credential Manager / macOS Keychain / Secret Service.
keyring = "4.2.0"
axiom-protocol = { path = "../crates/protocol" }
rrule = "0.14"
chrono-tz = "0.10"
sha2 = "0.10"
base64 = "0.22"
roxmltree = "0.21"
async-trait = "0.1"
tauri-plugin-notification = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
getrandom = "0.3"


[dev-dependencies]
axiom-server = { path = "../server" }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
# Without the default `zip` feature: our updates are the signed setup .exe
# (and .app.tar.gz on macOS, which doesn't need it), never zip archives, and
# the `zip` crate it pulls in has open advisories (RUSTSEC-2026-0367..0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
